name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  build-exe:
    name: Build Windows executable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name CodeAgent --paths src --add-data "samples;samples" --collect-submodules openai --collect-data certifi main.py
      - name: Smoke test executable
        shell: pwsh
        run: $p = Start-Process dist/CodeAgent.exe -ArgumentList "--selftest" -Wait -PassThru; if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: CodeAgent-windows
          path: dist/CodeAgent.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CodeAgent-windows
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/CodeAgent.exe
